name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: jdx/mr-boxington-action@v1
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libfontconfig-dev libwayland-dev libxkbcommon-x11-dev \
            libssl-dev libzstd-dev libvulkan1 libgit2-dev make cmake clang mold
      - run: cargo fmt --all -- --check
      # Scoped to our workspace: a global RUSTFLAGS=-D warnings would also
      # promote warnings in third-party crates and fail on their schedule.
      - run: mbx clippy --workspace --all-targets -- -D warnings
      - run: mbx test --workspace
